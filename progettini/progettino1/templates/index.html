<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macchine Usate</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1 class="mb-4">Catalogo Macchine Usate</h1>

    <!-- Form di filtraggio -->
    <form id="filter-form" class="mb-4">
        <div class="row g-3">
            <div class="col-md-4">
                <input type="text" id="marca" class="form-control" placeholder="Marca">
            </div>
            <div class="col-md-4">
                <input type="text" id="alimentazione" class="form-control" placeholder="Alimentazione">
            </div>
            <div class="col-md-4">
                <input type="text" id="colore" class="form-control" placeholder="Colore">
            </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Filtra</button>
    </form>

    <!-- Tabella -->
    <table class="table table-striped table-hover">
        <thead class="table-light">
            <tr>
                <th>Marca</th>
                <th>Modello</th>
                <th>Alimentazione</th>
                <th>Colore</th>
            </tr>
        </thead>
        <tbody id="car-table-body">
            {% if macchine_usate %}
                {% for macchina in macchine_usate %}
                    <tr>
                        <td>{{ macchina.marca }}</td>
                        <td>{{ macchina.modello }}</td>
                        <td>{{ macchina.alimentazione }}</td>
                        <td>{{ macchina.colore }}</td>
                    </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="4" class="text-center">Nessuna macchina disponibile</td>
                </tr>
            {% endif %}
        </tbody>
    </table>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='scripts/Script.js') }}"></script>
</body>
</html>
